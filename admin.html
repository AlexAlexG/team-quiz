<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админ-панель ведущего — Квиз</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Библиотека для генерации QR-кода -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set, get, update, onValue, push, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        // ⚠️ ЗАМЕНИТЕ НА СВОИ ДАННЫЕ ИЗ FIREBASE CONSOLE
        const firebaseConfig = {
            apiKey: "AIzaSyCvsRaEbkYxMPySS8-OC7BMJywcTJ4enFs",
  authDomain: "teamquiz-e1717.firebaseapp.com",
  projectId: "teamquiz-e1717",
  storageBucket: "teamquiz-e1717.firebasestorage.app",
  messagingSenderId: "276917073542",
  appId: "1:276917073542:web:69e163fb87d6b4e88b8307"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        window.db = db;
        window.dbRef = { ref, set, get, update, onValue, push, remove };
        window.dispatchEvent(new Event('firebase-ready'));
    </script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-4 font-sans">

    <div class="max-w-4xl mx-auto space-y-6">
        <!-- Шапка -->
        <header class="bg-slate-800 p-4 rounded-2xl border border-slate-700 flex justify-between items-center shadow-xl">
            <div>
                <h1 class="text-xl font-bold text-indigo-400">👨‍💻 Админ-панель ведущего</h1>
                <p class="text-xs text-slate-400">Управление викториной и подключением команд</p>
            </div>
            <button onclick="resetGame()" class="bg-red-600/30 hover:bg-red-600 text-red-200 hover:text-white px-3 py-1.5 rounded-lg text-xs transition border border-red-500/50">
                🔄 Сбросить всю игру
            </button>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <!-- Левая колонка: Вопросы и Старт -->
            <div class="md:col-span-2 space-y-6">
                <!-- Конструктор вопросов -->
                <div class="bg-slate-800 p-6 rounded-2xl border border-slate-700 shadow-xl space-y-4">
                    <h2 class="font-bold text-lg text-slate-200">Добавить вопрос (<span id="q-count">0</span>)</h2>
                    
                    <div class="space-y-3">
                        <input type="text" id="q-text" placeholder="Текст вопроса" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-sm focus:outline-none focus:border-indigo-500">
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
                            <input type="text" id="q-opt1" placeholder="Вариант 1" class="bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-sm">
                            <input type="text" id="q-opt2" placeholder="Вариант 2" class="bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-sm">
                            <input type="text" id="q-opt3" placeholder="Вариант 3" class="bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-sm">
                            <input type="text" id="q-opt4" placeholder="Вариант 4" class="bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-sm">
                        </div>
                        <div class="flex gap-2 items-center justify-between">
                            <div class="flex items-center gap-2">
                                <label class="text-sm text-slate-400">Правильный:</label>
                                <select id="q-correct" class="bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-sm">
                                    <option value="0">Вариант 1</option>
                                    <option value="1">Вариант 2</option>
                                    <option value="2">Вариант 3</option>
                                    <option value="3">Вариант 4</option>
                                </select>
                            </div>
                            <button onclick="addQuestion()" class="bg-indigo-600 hover:bg-indigo-500 text-white px-5 py-2.5 rounded-xl text-sm font-bold transition shadow">
                                + Добавить в базу
                            </button>
                        </div>
                    </div>

                    <!-- Список добавленных вопросов -->
                    <div class="pt-4 border-t border-slate-700">
                        <h3 class="text-xs font-bold text-slate-400 uppercase mb-2">Созданные вопросы:</h3>
                        <div id="admin-questions-list" class="space-y-2 max-h-48 overflow-y-auto text-xs text-slate-300 pr-1">
                            <span class="text-slate-500">Пока нет вопросов...</span>
                        </div>
                    </div>

                    <!-- Кнопка старта -->
                    <button onclick="startQuiz()" id="start-btn" class="w-full bg-emerald-600 hover:bg-emerald-500 font-bold py-3.5 rounded-xl transition shadow-lg hidden text-base">
                        🚀 Запустить викторину для всех команд
                    </button>
                </div>

                <!-- Активное управление игрой (появляется при старте) -->
                <div id="admin-control-section" class="hidden bg-slate-800 p-6 rounded-2xl border border-slate-700 shadow-xl space-y-4">
                    <div class="flex justify-between items-center">
                        <span class="text-sm text-slate-400">Статус: <strong id="admin-game-status" class="text-yellow-400">Идет игра</strong></span>
                        <span class="text-sm bg-indigo-950 text-indigo-300 px-3 py-1 rounded-full font-bold">Вопрос <span id="current-q-index">1</span></span>
                    </div>
                    <div class="bg-slate-900 p-4 rounded-xl border border-slate-700">
                        <p id="admin-current-q-text" class="text-lg font-semibold text-white mb-2"></p>
                    </div>
                    <button onclick="nextQuestion()" class="w-full bg-indigo-600 hover:bg-indigo-500 font-bold py-3.5 rounded-xl transition shadow-lg text-sm">
                        Следующий вопрос / Завершить ➡️
                    </button>
                </div>
            </div>

            <!-- Правая колонка: QR-код для игроков и Таблица лидеров -->
            <div class="space-y-6">
                <!-- QR Код -->
                <div class="bg-slate-800 p-6 rounded-2xl border border-slate-700 shadow-xl text-center space-y-3">
                    <h2 class="font-bold text-slate-200 text-sm">QR-код для команд</h2>
                    <p class="text-xs text-slate-400">Дайте участникам отсканировать его:</p>
                    <div id="qrcode" class="bg-white p-3 rounded-xl inline-block flex justify-center"></div>
                    <div class="text-xs text-indigo-400 break-all select-all font-mono bg-slate-900 p-2 rounded border border-slate-700" id="player-link-display"></div>
                </div>

                <!-- Таблица лидеров -->
                <div class="bg-slate-800 p-6 rounded-2xl border border-slate-700 shadow-xl space-y-3">
                    <h2 class="font-bold text-slate-200 text-sm">Таблица лидеров</h2>
                    <div id="admin-leaderboard" class="space-y-2 bg-slate-900 p-3 rounded-xl border border-slate-700 max-h-64 overflow-y-auto">
                        <span class="text-xs text-slate-500">Ожидание команд...</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let questionsList = [];

        window.addEventListener('firebase-ready', () => {
            initAdmin();
            generateQRCode();
        });

        function generateQRCode() {
            // Автоматически вычисляем ссылку на player.html на базе текущего адреса admin.html
            const currentUrl = window.location.href;
            const playerUrl = currentUrl.replace('admin.html', 'index.html');
            document.getElementById('player-link-display').innerText = playerUrl;
            
            document.getElementById("qrcode").innerHTML = "";
            new QRCode(document.getElementById("qrcode"), {
                text: playerUrl,
                width: 140,
                height: 140,
                colorDark: "#0f172a",
                colorLight: "#ffffff",
                correctLevel: QRCode.CorrectLevel.H
            });
        }

        function initAdmin() {
            const { ref, onValue } = window.dbRef;
            
            // Загрузка вопросов из Firebase
            onValue(ref(window.db, 'quiz/questions'), (snapshot) => {
                const data = snapshot.val();
                questionsList = data ? Object.values(data) : [];
                document.getElementById('q-count').innerText = questionsList.length;
                
                const listEl = document.getElementById('admin-questions-list');
                listEl.innerHTML = '';
                if (questionsList.length === 0) {
                    listEl.innerHTML = '<span class="text-slate-500">Пока нет вопросов...</span>';
                    document.getElementById('start-btn').classList.add('hidden');
                    return;
                }

                questionsList.forEach((q, idx) => {
                    listEl.innerHTML += `<div class="p-2.5 bg-slate-900 rounded-xl border border-slate-800"><b>${idx+1}.</b> ${q.text}</div>`;
                });
                document.getElementById('start-btn').classList.remove('hidden');
            });

            // Таблица лидеров
            onValue(ref(window.db, 'quiz/teams'), (snapshot) => {
                const teams = snapshot.val();
                const lbEl = document.getElementById('admin-leaderboard');
                lbEl.innerHTML = '';
                if (!teams) {
                    lbEl.innerHTML = '<span class="text-xs text-slate-500">Ожидание команд...</span>';
                    return;
                }
                const sorted = Object.entries(teams).sort((a,b) => b[1].score - a[1].score);
                sorted.forEach(([name, data], idx) => {
                    lbEl.innerHTML += `
                        <div class="flex justify-between items-center bg-slate-800 p-2.5 rounded-lg text-sm border border-slate-700/50">
                            <span>#${idx+1} <b>${name}</b></span>
                            <span class="text-indigo-400 font-bold">${data.score} б.</span>
                        </div>`;
                });
            });

            // Статус игры
            onValue(ref(window.db, 'quiz/state'), (snapshot) => {
                const state = snapshot.val() || { status: 'waiting', currentQuestion: 0 };
                if (state.status === 'playing') {
                    document.getElementById('admin-control-section').classList.remove('hidden');
                    if (questionsList[state.currentQuestion]) {
                        document.getElementById('current-q-index').innerText = state.currentQuestion + 1;
                        document.getElementById('admin-current-q-text').innerText = questionsList[state.currentQuestion].text;
                    }
                } else if (state.status === 'finished') {
                    document.getElementById('admin-game-status').innerText = 'Игра завершена';
                    document.getElementById('admin-current-q-text').innerText = "🏆 Викторина завершена!";
                }
            });
        }

        function addQuestion() {
            const text = document.getElementById('q-text').value.trim();
            const options = [
                document.getElementById('q-opt1').value.trim(),
                document.getElementById('q-opt2').value.trim(),
                document.getElementById('q-opt3').value.trim(),
                document.getElementById('q-opt4').value.trim()
            ];
            const correct = parseInt(document.getElementById('q-correct').value);

            if (!text || options.some(o => !o)) {
                alert('Заполните текст вопроса и все 4 варианта ответов!');
                return;
            }

            const { ref, push, set } = window.dbRef;
            const newQRef = push(ref(window.db, 'quiz/questions'));
            set(newQRef, { text, options, correct }).then(() => {
                // Очистка полей ввода
                document.getElementById('q-text').value = '';
                document.getElementById('q-opt1').value = '';
                document.getElementById('q-opt2').value = '';
                document.getElementById('q-opt3').value = '';
                document.getElementById('q-opt4').value = '';
            });
        }

        function startQuiz() {
            const { ref, set } = window.dbRef;
            set(ref(window.db, 'quiz/state'), { status: 'playing', currentQuestion: 0, startTime: Date.now() });
        }

        function nextQuestion() {
            const { ref, get, set } = window.dbRef;
            get(ref(window.db, 'quiz/state')).then((snapshot) => {
                const state = snapshot.val();
                const nextIdx = state.currentQuestion + 1;
                if (nextIdx < questionsList.length) {
                    set(ref(window.db, 'quiz/state'), { status: 'playing', currentQuestion: nextIdx, startTime: Date.now() });
                } else {
                    set(ref(window.db, 'quiz/state'), { status: 'finished', currentQuestion: state.currentQuestion });
                }
            });
        }

        function resetGame() {
            if (confirm('Сбросить игру, вопросы и все команды?')) {
                const { ref, remove } = window.dbRef;
                remove(ref(window.db, 'quiz')).then(() => location.reload());
            }
        }
    </script>
</body>
</html>
