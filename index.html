<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Командная викторина — Игрок</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set, get, update, onValue, push } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        // ⚠️ ЗАМЕНИТЕ НА ТЕ ЖЕ ДАННЫЕ ИЗ FIREBASE CONSOLE
        const firebaseConfig = {
  apiKey: "AIzaSyCvsRaEbkYxMPySS8-OC7BMJywcTJ4enFs",
  authDomain: "teamquiz-e1717.firebaseapp.com",
  databaseURL: "https://teamquiz-e1717-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "teamquiz-e1717",
  storageBucket: "teamquiz-e1717.firebasestorage.app",
  messagingSenderId: "276917073542",
  appId: "1:276917073542:web:69e163fb87d6b4e88b8307"
};

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        window.db = db;
        window.dbRef = { ref, set, get, update, onValue, push };
        window.dispatchEvent(new Event('firebase-ready'));
    </script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between font-sans p-4">

    <header class="text-center py-2">
        <h1 class="text-lg font-bold tracking-wider text-emerald-400">⚡ КОМАНДНАЯ ВИКТОРИНА</h1>
    </header>

    <main class="container mx-auto max-w-md flex-grow flex flex-col justify-center">

        <!-- Регистрация команды -->
        <div id="player-reg-section" class="bg-slate-800 p-6 rounded-2xl border border-slate-700 text-center shadow-xl space-y-4">
            <h2 class="text-xl font-bold text-white">Вход в игру</h2>
            <p class="text-xs text-slate-400">Введите название вашей команды. Только один игрок с телефона отправляет ответы.</p>
            <input type="text" id="team-name-input" placeholder="Например: Эрудит" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-center text-base mb-2 focus:outline-none focus:border-emerald-500">
            <button onclick="registerTeam()" class="w-full bg-emerald-600 hover:bg-emerald-500 font-bold py-3.5 rounded-xl transition shadow-lg text-sm">
                Войти в игру 🎮
            </button>
        </div>

        <!-- Ожидание старта -->
        <div id="player-waiting-section" class="hidden bg-slate-800 p-8 rounded-2xl border border-slate-700 text-center shadow-xl space-y-4">
            <div class="animate-pulse text-4xl">⏳</div>
            <h2 class="text-lg font-bold text-slate-200" id="waiting-title">Ожидание начала игры...</h2>
            <p class="text-xs text-slate-400" id="waiting-subtitle">Ведущий скоро запустит первый вопрос.</p>
            <div class="mt-4 p-3 bg-slate-900 rounded-xl inline-block text-xs text-slate-300">
                Команда: <strong id="my-team-display" class="text-emerald-400"></strong><br>
                Баллов: <strong id="my-score-display" class="text-indigo-400">0</strong>
            </div>
        </div>

        <!-- Экран вопроса -->
        <div id="player-question-section" class="hidden bg-slate-800 p-6 rounded-2xl border border-slate-700 shadow-xl space-y-4">
            <div class="flex justify-between items-center text-xs text-slate-400">
                <span>Вопрос <span id="p-q-num">1</span></span>
                <span id="timer-display" class="bg-red-500/20 text-red-400 px-2.5 py-1 rounded-lg font-bold">⏱ 30 сек</span>
            </div>
            <h3 id="p-q-text" class="text-lg font-bold text-white text-center py-2"></h3>
            
            <div id="p-options-grid" class="grid grid-cols-1 gap-3">
                <!-- Варианты ответов -->
            </div>
        </div>

    </main>

    <footer class="text-center py-3 text-xs text-slate-500">
        Удачной игры!
    </footer>

    <script>
        let myTeamName = null;
        let questionsList = [];
        let currentTimer = null;
        let answeredCurrent = false;

        window.addEventListener('firebase-ready', () => {
            // Загружаем список вопросов заранее
            const { ref, onValue } = window.dbRef;
            onValue(ref(window.db, 'quiz/questions'), (snapshot) => {
                const data = snapshot.val();
                questionsList = data ? Object.values(data) : [];
            });
        });

        function registerTeam() {
            const name = document.getElementById('team-name-input').value.trim();
            if (!name) {
                alert('Введите название команды!');
                return;
            }
            myTeamName = name;
            const { ref, set, get } = window.dbRef;
            
            get(ref(window.db, 'quiz/teams/' + name)).then((snapshot) => {
                set(ref(window.db, 'quiz/teams/' + name), { score: snapshot.exists() ? snapshot.val().score : 0 }).then(() => {
                    initPlayerGame();
                });
            });
        }

        function initPlayerGame() {
            document.getElementById('player-reg-section').classList.add('hidden');
            document.getElementById('player-waiting-section').classList.remove('hidden');
            document.getElementById('my-team-display').innerText = myTeamName;

            const { ref, onValue } = window.dbRef;

            onValue(ref(window.db, 'quiz/teams/' + myTeamName + '/score'), (snapshot) => {
                document.getElementById('my-score-display').innerText = snapshot.val() || 0;
            });

            onValue(ref(window.db, 'quiz/state'), (snapshot) => {
                const state = snapshot.val();
                if (!state) return;

                if (state.status === 'waiting') {
                    showWaitingScreen("Ожидание начала игры...", "Ведущий скоро начнет.");
                } else if (state.status === 'playing') {
                    renderActiveQuestion(state.currentQuestion);
                } else if (state.status === 'finished') {
                    showWaitingScreen("🏆 Викторина завершена!", "Смотрите итоговые результаты на экране ведущего.");
                }
            });
        }

        function showWaitingScreen(title, subtitle) {
            document.getElementById('player-question-section').classList.add('hidden');
            document.getElementById('player-waiting-section').classList.remove('hidden');
            document.getElementById('waiting-title').innerText = title;
            document.getElementById('waiting-subtitle').innerText = subtitle;
        }

        function renderActiveQuestion(qIndex) {
            const q = questionsList[qIndex];
            if (!q) return;

            answeredCurrent = false;
            document.getElementById('player-waiting-section').classList.add('hidden');
            document.getElementById('player-question-section').classList.remove('hidden');

            document.getElementById('p-q-num').innerText = (qIndex + 1) + " из " + questionsList.length;
            document.getElementById('p-q-text').innerText = q.text;

            const grid = document.getElementById('p-options-grid');
            grid.innerHTML = '';

            q.options.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = "w-full bg-slate-900 hover:bg-indigo-600/40 border border-slate-700 p-4 rounded-xl text-left font-medium transition text-sm";
                btn.innerText = opt;
                btn.onclick = () => submitAnswer(idx, q.correct);
                grid.appendChild(btn);
            });

            startPlayerTimer(30);
        }

        function startPlayerTimer(seconds) {
            if (currentTimer) clearInterval(currentTimer);
            let timeLeft = seconds;
            const timerEl = document.getElementById('timer-display');
            timerEl.innerText = `⏱ ${timeLeft} сек`;

            currentTimer = setInterval(() => {
                timeLeft--;
                timerEl.innerText = `⏱ ${timeLeft} сек`;
                if (timeLeft <= 0) {
                    clearInterval(currentTimer);
                    if (!answeredCurrent) lockAnswers("Время вышло!");
                }
            }, 1000);
        }

        function submitAnswer(selectedIndex, correctIndex) {
            if (answeredCurrent) return;
            answeredCurrent = true;
            if (currentTimer) clearInterval(currentTimer);

            const buttons = document.getElementById('p-options-grid').children;
            for (let b of buttons) b.disabled = true;

            if (selectedIndex === correctIndex) {
                buttons[selectedIndex].classList.remove('bg-slate-900');
                buttons[selectedIndex].classList.add('bg-emerald-600', 'text-white');
                
                const { ref, get, set } = window.dbRef;
                const scoreRef = ref(window.db, 'quiz/teams/' + myTeamName + '/score');
                get(scoreRef).then((snapshot) => {
                    set(scoreRef, (snapshot.val() || 0) + 1);
                });
            } else {
                buttons[selectedIndex].classList.remove('bg-slate-900');
                buttons[selectedIndex].classList.add('bg-rose-600', 'text-white');
                buttons[correctIndex].classList.add('bg-emerald-600/60', 'text-white');
            }

            lockAnswers("Ответ принят! Ожидайте следующий вопрос...");
        }

        function lockAnswers(message) {
            const grid = document.getElementById('p-options-grid');
            grid.innerHTML = `<div class="text-center p-6 text-indigo-300 font-semibold bg-slate-900 rounded-xl text-sm">${message}</div>`;
        }
    </script>
</body>
</html>
